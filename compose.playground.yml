# Local demo: every dialect mounted, every unpic provider, playground public, unsigned requests
# allowed (video transformations too, demo only), repo fixtures as the `local` source and any
# http(s) URL through `web`.
# DEV ONLY (dev mode + open policy). Build the image first, e.g.
#   XI_APP_BASE=xtandard-base:dev-gpl XI_IMAGE=xtandard-image:dev-gpl task release:build
#   XI_IMAGE=xtandard-image:dev-gpl docker compose -f compose.playground.yml up -d
# then open http://<host>:8080/_playground/
services:
  xtandard:
    image: ${XI_IMAGE:-xtandard-image:dev-gpl}
    container_name: xtandard-play
    restart: unless-stopped
    ports: ["8080:8080", "9090:9090"]
    volumes: ["./testdata/fixtures:/fixtures:ro"]
    environment:
      XI_DEV_MODE: "true"
      XI_SECURITY_UNSIGNED_POLICY: allow
      XI_ADMIN_ADDR: ":9090"
      XI_ADMIN_DOCS: "true"
      XI_PLAYGROUND_ENABLED: "true"
      XI_PLAYGROUND_PUBLIC: "true"
      XI_SOURCES: local,web
      XI_SOURCES_LOCAL_TYPE: fs
      XI_SOURCES_LOCAL_ROOT: /fixtures
      XI_SOURCES_WEB_TYPE: http
      XI_SOURCES_WEB_ALLOW: "*"
      # The media Examples (WP-129) fetch public trailers and NASA clips of up to 25 MB; 30 s per
      # attempt instead of the default 10 s keeps a slow link from failing them.
      XI_FETCH_TIMEOUT: 30s
      # No XI_PROCESSING_WATERMARK_SOURCE (WP-117): the playground's watermarks are all explicit
      # in the URL (wmu, wmt, dialect overlays); the default image is an imgproxy-compatibility
      # option, shown by one Example that stays disabled here.
      XI_DIALECTS_QUERY_ENABLED: "true"
      XI_DIALECTS_WSRV_ENABLED: "true"
      XI_DIALECTS_CLOUDFLARE_ENABLED: "true"
      # Bound to the fixtures so /cdn-cgi/media/ (and /cdn-cgi/image/) address them by path; http(s)
      # sources stay absolute URLs.
      XI_DIALECTS_CLOUDFLARE_SOURCE: local
      XI_DIALECTS_CLOUDFLARE_IMAGES_ENABLED: "true"
      XI_DIALECTS_CLOUDFLARE_IMAGES_SOURCE: web
      XI_DIALECTS_IMGIX_ENABLED: "true"
      XI_DIALECTS_IMGIX_SOURCE: web
      XI_DIALECTS_CLOUDINARY_ENABLED: "true"
      # Public IDs are fixture keys (/video/upload/video/clip-av1.mp4); /fetch/ takes any http(s) URL.
      XI_DIALECTS_CLOUDINARY_SOURCE: local
      XI_DIALECTS_IMAGEKIT_ENABLED: "true"
      # ImageKit addresses images by key, so it is bound to the fixtures (web has no base_url).
      XI_DIALECTS_IMAGEKIT_SOURCE: local
      XI_DIALECTS_BUNNY_ENABLED: "true"
      XI_DIALECTS_BUNNY_SOURCE: web
      XI_DIALECTS_THUMBOR_ENABLED: "true"
      XI_DIALECTS_AWSSIH_ENABLED: "true"
      XI_DIALECTS_AWSSIH_SOURCE: web
      XI_DIALECTS_SIMPLE_ENABLED: appwrite,astro,builderio,cloudimage,contentful,contentstack,directus,hygraph,imageengine,ipx,keycdn,kontentai,netlify,nextjs,scene7,shopify,storyblok,supabase,uploadcare,wordpress
      XI_DIALECTS_SIMPLE_SOURCE: web
      # gpl image only: EPS/PS/AI through the sandboxed Ghostscript subprocess (WP-99, ADR 0011)
      XI_FORMATS_EPS_ENABLED: "true"
      # Video transformations (WP-121 to WP-127): /video, /q/video, Cloudinary /video/, ImageKit video
      # files and /cdn-cgi/media/, with the playground's video mode. full and gpl images only (slim
      # refuses to start with this on). DEMO ONLY: unsigned video transformations are allowed so the
      # playground works without XI_SIGNING_KEYS; the default (deny) answers 403 to unsigned video
      # URLs, and a public deployment must keep it (ADR 0012 §8).
      XI_VIDEO_TRANSFORM_ENABLED: "true"
      XI_VIDEO_TRANSFORM_UNSIGNED_POLICY: allow
      # Demo limits: small clips, quick answers.
      XI_VIDEO_TRANSFORM_WORKERS: "2"
      XI_VIDEO_TRANSFORM_QUEUE: "8"
      XI_VIDEO_TRANSFORM_TIMEOUT: 60s
      XI_VIDEO_TRANSFORM_MAX_INPUT_BYTES: 128MiB
      XI_VIDEO_TRANSFORM_MAX_INPUT_DURATION: 10m
      XI_VIDEO_TRANSFORM_MAX_OUTPUT_DURATION: 60s
      XI_VIDEO_TRANSFORM_MAX_OUTPUT_PIXELS: "2073600"
      XI_VIDEO_TRANSFORM_MAX_OUTPUT_BYTES: 64MiB
      XI_VIDEO_TRANSFORM_MAX_FPS: "60"
      # Video presets (WP-132) for the preset Examples: pr:preview (imgproxy, /q/video preset=),
      # t_web (Cloudinary), n-web (ImageKit). The demo keeps the allow policy above; a public
      # deployment without signing would set XI_VIDEO_TRANSFORM_UNSIGNED_POLICY=restricted to
      # admit only these (plus XI_VIDEO_TRANSFORM_UNSIGNED_ALLOWED_OPTIONS).
      XI_VIDEO_TRANSFORM_PRESETS: "web=resize:fit:854:0/quality:60/format:webm,preview=duration:2/resize:fit:320:0/mute:1/format:webm"
