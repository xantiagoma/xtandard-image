apiVersion: v1
kind: Pod
metadata:
  name: {{ include "xi.fullname" . }}-test
  # Not the selector labels: the Service and NetworkPolicy must not pick it up.
  labels:
    app.kubernetes.io/name: {{ include "xi.name" . }}-test
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: health
      image: {{ .Values.tests.image }}
      command: ["wget", "-q", "-O-", "http://{{ include "xi.fullname" . }}:{{ .Values.service.port }}/healthz"]
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities: { drop: [ALL] }
      resources:
        limits: { cpu: 100m, memory: 32Mi }
