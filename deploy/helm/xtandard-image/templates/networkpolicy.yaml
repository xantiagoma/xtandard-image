{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "xi.fullname" . }}
  labels:
    {{- include "xi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "xi.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress{{ if .Values.networkPolicy.egress.enabled }}, Egress{{ end }}]
  ingress:
    - ports:
        - { port: http, protocol: TCP }
      {{- with .Values.networkPolicy.httpFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        - { port: admin, protocol: TCP }
      from:
        {{- toYaml .Values.networkPolicy.metricsFrom | nindent 8 }}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [169.254.169.254/32]
      ports:
        {{- range .Values.networkPolicy.egress.ports }}
        - { port: {{ . }}, protocol: TCP }
        {{- end }}
    {{- with .Values.networkPolicy.egress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
