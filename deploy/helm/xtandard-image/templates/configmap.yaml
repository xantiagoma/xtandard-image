apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "xi.fullname" . }}-env
  labels:
    {{- include "xi.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- if .Values.configFile }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "xi.fullname" . }}-config
  labels:
    {{- include "xi.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- .Values.configFile | nindent 4 }}
{{- end }}
