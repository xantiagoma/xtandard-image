# Reverse proxy for compose.split.yml: video transformations to the video fleet, the rest to the
# image fleet. The same routing table applies to any proxy or load balancer (docs/DEPLOY.md
# "Image and video fleets"). Put a CDN in front of this (docs/OPERATIONS.md).
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 4096;
}

http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Docker's embedded DNS; re-resolve every 10 s so `--scale` adds and removes replicas.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $uri $xi_fleet {
    default             image:8080;
    # imgproxy dialect video transformations (and their HLS/DASH manifests).
    ~^/video/           video:8080;
    # Query dialect video transformations (GET and QUERY).
    ~^/q/video(/|$)     video:8080;
    # Child URLs of HLS and DASH manifests (playlists, init and media segments).
    ~^/_stream/         video:8080;
    # Enable the lines of the dialects you mount (paths as in docs/URL-DIALECTS.md); Cloudinary
    # /video/upload also serves stills of a video, which the video fleet answers too.
    # ~^/[^/]+/video/(upload|fetch)/  video:8080;   # Cloudinary
    # ~^/cdn-cgi/media/               video:8080;   # Cloudflare Media Transformations
  }

  server {
    listen 8080;
    server_tokens off;

    # Range requests and long transcodes: no buffering, generous read timeout.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 180s;
    proxy_next_upstream error timeout http_503;
    # QUERY (RFC 10008) bodies on /q/ are small (XI_SERVER_QUERY_MAX_BODY_BYTES, 64 KiB).
    client_max_body_size 128k;

    location = /proxy-healthz {
      access_log off;
      return 200 "ok\n";
    }

    location / {
      add_header X-Xi-Fleet $xi_fleet always;
      proxy_pass http://$xi_fleet;
    }
  }
}
