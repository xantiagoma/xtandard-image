# Local observability stack (docs/OPERATIONS.md §6.6): xtandard-image with
# tracing on, Prometheus (rules from prometheus/rules.yml), Grafana with the
# dashboard provisioned, an OpenTelemetry Collector and Tempo.
#
#   XI_IMAGE=xtandard-image:main-gpl docker compose -f deploy/observability/compose.yml up -d
#   docker compose -f deploy/observability/compose.yml --profile load run --rm k6   # some traffic
#   open http://localhost:13000   (Grafana, dashboard "xtandard-image"; Explore → Tempo for traces)
#   open http://localhost:19190   (Prometheus: targets, rules, alerts)
#   docker compose -f deploy/observability/compose.yml down
#
# Host ports are 1xxxx so they do not collide with a server on 8080/9090.
# Development settings: unsigned URLs allowed, dev mode. Never deploy this.
name: xi-observability

services:
  xtandard-image:
    image: ${XI_IMAGE:-xtandard-image:main-gpl}
    environment:
      XI_ADMIN_ADDR: ":9090"
      XI_SECURITY_UNSIGNED_POLICY: allow
      XI_SOURCES: local
      XI_SOURCES_LOCAL_TYPE: fs
      XI_SOURCES_LOCAL_ROOT: /fixtures
      XI_CACHE_RESULT_STORES: memory
      # 30 % of the 2g limit below (the server does not derive it yet).
      GOMEMLIMIT: 600MiB
      # Video transformations need the full or gpl image; set it to false
      # with a slim image.
      XI_VIDEO_TRANSFORM_ENABLED: ${XI_VIDEO_TRANSFORM_ENABLED:-true}
      XI_VIDEO_TRANSFORM_UNSIGNED_POLICY: allow
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: xtandard-image
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local
    volumes:
      - ../../testdata/fixtures:/fixtures:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }
    ports:
      - "18080:8080"
    depends_on: [otel-collector]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [tempo]

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    tmpfs:
      - /var/tempo:mode=1777

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    tmpfs:
      - /prometheus:mode=1777
    ports:
      - "19190:9090"

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "13000:3000"
    depends_on: [prometheus, tempo]

  # Traffic generator: docker compose ... --profile load run --rm k6
  k6:
    image: grafana/k6:1.3.0
    profiles: [load]
    command: ["run", "/load/traffic.js"]
    environment:
      TARGET: http://xtandard-image:8080
      DURATION: ${DURATION:-2m}
      RATE: ${RATE:-20}
    volumes:
      - ./load:/load:ro
    depends_on: [xtandard-image]
