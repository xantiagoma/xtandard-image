# Prometheus for the local stack (compose.yml). In Kubernetes use the
# ServiceMonitor (deploy/kubernetes/components/monitoring, Helm
# serviceMonitor.enabled) instead.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  # Next to this file (compose mounts both in /etc/prometheus).
  - rules.yml

scrape_configs:
  # The admin listener (XI_ADMIN_ADDR=:9090), never the public port.
  - job_name: xtandard-image
    metrics_path: /metrics
    static_configs:
      - targets: ["xtandard-image:9090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
