# xtandard-image recording rules, SLOs and alerts (docs/OPERATIONS.md §6).
#
# This file is the single source. deploy/scripts/gen.sh copies it into the
# Helm chart (files/prometheus-rules.yml) and wraps it in the Kustomize
# PrometheusRule (components/monitoring/prometheusrule.yaml); `gen.sh
# --check` fails on drift. Tests: rules.test.yml (promtool test rules).
#
# Every series is aggregated by (namespace, job), so each fleet (image,
# video, or each Helm release) gets its own SLO and its own alerts. The
# up{} alert matches scrape jobs whose name contains "xtandard-image".
#
# SLOs (adjust the objectives in the expressions and the alert factors):
#   availability  99.9 % of processing requests are not 5xx (502 excluded:
#                 the origin failed) and not shed with 429
#   latency       99 % of successful image requests finish within 1 s
#                 (video formats and HLS/DASH parts excluded; the video
#                 fleet has its own alert on xi_video_transform_*)
groups:
  - name: xtandard-image.recording
    interval: 30s
    rules:
      - record: job:xi_requests:rate5m
        expr: sum by (namespace, job) (rate(xi_requests_total[5m]))
      - record: job:xi_requests:rate5m_by_status
        expr: sum by (namespace, job, status) (rate(xi_requests_total[5m]))
      - record: job:xi_request_duration_seconds:p50_5m
        expr: histogram_quantile(0.50, sum by (namespace, job, le) (rate(xi_request_duration_seconds_bucket[5m])))
      - record: job:xi_request_duration_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (namespace, job, le) (rate(xi_request_duration_seconds_bucket[5m])))
      - record: job:xi_request_duration_seconds:p99_5m
        expr: histogram_quantile(0.99, sum by (namespace, job, le) (rate(xi_request_duration_seconds_bucket[5m])))
      # Processing jobs (running + waiting) per worker. Workers default to
      # GOMAXPROCS (the CPU limit); with XI_PROCESSING_WORKERS set, this is
      # per CPU instead. Above 1 means requests wait for a worker.
      - record: job:xi_queue_utilisation:ratio
        expr: sum by (namespace, job) (xi_queue_depth) / sum by (namespace, job) (go_sched_gomaxprocs_threads)
      - record: job:xi_workers_busy:ratio
        expr: sum by (namespace, job) (xi_workers_busy) / sum by (namespace, job) (go_sched_gomaxprocs_threads)
      - record: job:xi_overload:rate5m
        expr: sum by (namespace, job, reason) (rate(xi_overload_total[5m]))
      # Per store: memory, disk, redis, s3 (result tiers), origin (source
      # bytes), stream (HLS/DASH parts).
      - record: job:xi_cache_hit:ratio_rate5m
        expr: |
          sum by (namespace, job, store) (rate(xi_cache_requests_total{result="hit"}[5m]))
            / sum by (namespace, job, store) (rate(xi_cache_requests_total[5m]))
      # Video pool: cost held by running and waiting transcodes over capacity.
      - record: job:xi_video_transform_utilisation:ratio
        expr: |
          sum by (namespace, job) (xi_video_transform_capacity_used + xi_video_transform_queued_cost)
            / sum by (namespace, job) (xi_video_transform_capacity)

  - name: xtandard-image.slo
    interval: 30s
    rules:
      # Availability: error ratio over several windows (multi-window,
      # multi-burn-rate alerts, Google SRE workbook ch. 5).
      - record: job:xi_slo_errors:ratio_rate5m
        expr: |
          sum by (namespace, job) (rate(xi_requests_total{status=~"5..|429",status!="502"}[5m]))
            / sum by (namespace, job) (rate(xi_requests_total[5m]))
      - record: job:xi_slo_errors:ratio_rate30m
        expr: |
          sum by (namespace, job) (rate(xi_requests_total{status=~"5..|429",status!="502"}[30m]))
            / sum by (namespace, job) (rate(xi_requests_total[30m]))
      - record: job:xi_slo_errors:ratio_rate1h
        expr: |
          sum by (namespace, job) (rate(xi_requests_total{status=~"5..|429",status!="502"}[1h]))
            / sum by (namespace, job) (rate(xi_requests_total[1h]))
      - record: job:xi_slo_errors:ratio_rate6h
        expr: |
          sum by (namespace, job) (rate(xi_requests_total{status=~"5..|429",status!="502"}[6h]))
            / sum by (namespace, job) (rate(xi_requests_total[6h]))
      # Latency: share of successful image requests slower than 1 s.
      - record: job:xi_slo_slow:ratio_rate5m
        expr: |
          1 - (
            sum by (namespace, job) (rate(xi_request_duration_seconds_bucket{le="1",status=~"2..|304",dialect!="stream",format!~"mp4|webm|m4a|mp3|opus|ogg|flac|wav"}[5m]))
              / sum by (namespace, job) (rate(xi_request_duration_seconds_count{status=~"2..|304",dialect!="stream",format!~"mp4|webm|m4a|mp3|opus|ogg|flac|wav"}[5m]))
          )
      - record: job:xi_slo_slow:ratio_rate1h
        expr: |
          1 - (
            sum by (namespace, job) (rate(xi_request_duration_seconds_bucket{le="1",status=~"2..|304",dialect!="stream",format!~"mp4|webm|m4a|mp3|opus|ogg|flac|wav"}[1h]))
              / sum by (namespace, job) (rate(xi_request_duration_seconds_count{status=~"2..|304",dialect!="stream",format!~"mp4|webm|m4a|mp3|opus|ogg|flac|wav"}[1h]))
          )

  - name: xtandard-image.alerts
    rules:
      - alert: XtandardImageTargetDown
        expr: up{job=~".*xtandard-image.*"} == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "xtandard-image target {{ $labels.instance }} is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} ({{ $labels.job }}) on the admin listener (XI_ADMIN_ADDR) for 5 minutes."

      # 14.4x burn of a 99.9 % objective: 2 % of the 30-day budget per hour.
      - alert: XtandardImageAvailabilityBurnFast
        expr: |
          job:xi_slo_errors:ratio_rate1h > (14.4 * 0.001)
            and job:xi_slo_errors:ratio_rate5m > (14.4 * 0.001)
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} is burning its availability budget fast"
          description: "{{ $value | humanizePercentage }} of requests failed (5xx except 502, or 429) over the last hour. Check xi_overload_total (capacity, max replicas) and the logs for 500s."
      # 6x burn: 5 % of the budget in 6 hours.
      - alert: XtandardImageAvailabilityBurnSlow
        expr: |
          job:xi_slo_errors:ratio_rate6h > (6 * 0.001)
            and job:xi_slo_errors:ratio_rate30m > (6 * 0.001)
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }} is burning its availability budget"
          description: "{{ $value | humanizePercentage }} of requests failed over the last 6 hours."

      - alert: XtandardImageLatencyBurn
        expr: |
          job:xi_slo_slow:ratio_rate1h > (14.4 * 0.01)
            and job:xi_slo_slow:ratio_rate5m > (14.4 * 0.01)
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }} image requests are slow"
          description: "{{ $value | humanizePercentage }} of successful image requests took longer than 1 s over the last hour. Check xi_semaphore_wait_seconds (workers) and xi_source_fetch_duration_seconds (origin)."

      - alert: XtandardImageOverloaded
        expr: |
          sum by (namespace, job) (rate(xi_overload_total[5m]))
            / sum by (namespace, job) (rate(xi_requests_total[5m])) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }} sheds more than 5 % of requests"
          description: "{{ $value | humanizePercentage }} of requests get 429/503 from admission control. The autoscaler is at its maximum or too slow; raise maxReplicas or the CPU limit."

      - alert: XtandardImageQueueSaturated
        expr: job:xi_queue_utilisation:ratio > 1.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }} processing queue is saturated"
          description: "There are {{ $value | humanize }} jobs per worker (running + waiting) for 10 minutes."

      - alert: XtandardImagePanics
        expr: increase(xi_panics_total[15m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} recovered a handler panic"
          description: "xi_panics_total grew; the request got a 500. Search the logs for \"panic\" and report it."

      # A C crash (SIGSEGV in a decoder) kills the process; the orchestrator
      # restarts it, which resets process_start_time_seconds.
      - alert: XtandardImageRestarting
        expr: changes(process_start_time_seconds{job=~".*xtandard-image.*"}[30m]) > 2
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} restarted {{ $value }} times in 30 minutes"
          description: "Out of memory (the memory limit) or a native crash. Check the pod's last state and the previous container's log."

      # GOMEMLIMIT is XI_PROCESSING_GO_MEMORY_FRACTION (default 0.3) of the
      # cgroup limit, so the limit is GOMEMLIMIT / 0.3. Only when GOMEMLIMIT
      # was derived (a limit exists).
      - alert: XtandardImageMemoryNearLimit
        expr: |
          process_resident_memory_bytes{job=~".*xtandard-image.*"}
            > 0.9 * (go_gc_gomemlimit_bytes / 0.3)
            and go_gc_gomemlimit_bytes < 1e18
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} RSS is above 90 % of its memory limit"
          description: "Set XI_PROCESSING_MEMORY_BUDGET, lower XI_PROCESSING_WORKERS or raise the memory limit (docs/OPERATIONS.md §1)."

      - alert: XtandardImageUpstreamErrors
        expr: |
          sum by (namespace, job) (rate(xi_requests_total{status=~"502|504"}[5m]))
            / sum by (namespace, job) (rate(xi_requests_total[5m])) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }}: more than 5 % of requests fail at the origin"
          description: "502/504 mean the source failed or timed out (XI_FETCH_TIMEOUT). Check xi_source_fetch_duration_seconds by source."

      - alert: XtandardImageCacheWritesDropped
        expr: sum by (namespace, job) (rate(xi_cache_writes_dropped_total[10m])) > 0.1
        for: 15m
        labels: { severity: info }
        annotations:
          summary: "{{ $labels.job }} drops result cache writes"
          description: "The asynchronous write queue (XI_CACHE_RESULT_WRITE_QUEUE) is full: the slow tier (disk, Redis, S3) cannot keep up."

      - alert: XtandardImageVideoOverloaded
        expr: sum by (namespace, job) (rate(xi_video_transform_overload_total[5m])) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }} rejects video transformations"
          description: '{{ $value | printf "%.2f" }} rejections/s from the video pool (queue_full, queue_cost, wait_timeout). Scale the video fleet.'

      - alert: XtandardImageVideoFailures
        expr: |
          sum by (namespace, job) (rate(xi_video_transform_duration_seconds_count{result!~"ok|canceled"}[15m]))
            / sum by (namespace, job) (rate(xi_video_transform_duration_seconds_count[15m])) > 0.1
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }}: more than 10 % of video transformations fail"
          description: "Results other than ok and canceled (timeouts, limits, corrupt sources). See xi_video_transform_duration_seconds_count by result."

      - alert: XtandardImageVideoSpoolFull
        expr: sum by (namespace, job) (increase(xi_video_spool_rejections_total[10m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }} spool is full"
          description: "Spool reservations were refused with 503 (XI_VIDEO_TRANSFORM_SPOOL_MAX_BYTES). Raise it with the spool volume's size, or scale out."
