# Replaces the CPU HPA with a KEDA ScaledObject (KEDA 2.x installed in the
# cluster; it creates and owns the HPA). Triggers: per-pod xi_queue_depth,
# the 429/503 rate and CPU. docs/OPERATIONS.md §3.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - scaledobject.yaml

configurations:
  - kustomizeconfig.yaml

patches:
  - target: { kind: HorizontalPodAutoscaler }
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: unused
