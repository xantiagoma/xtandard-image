# Openship (https://openship.io, github.com/oblien/openship): self-hosted PaaS that deploys an
# existing docker-compose.yml as is (docs/DEPLOY.md "Openship"). NOT VERIFIED on the platform:
# its docs did not state how prebuilt images, replicas, health checks or secrets are configured,
# so this is the plain compose service; set the secrets in Openship's environment settings and
# route the domain to port 8080 with its edge proxy.
services:
  xtandard-image:
    image: ${XI_IMAGE:-ghcr.io/xantiagoma/xtandard-image:0.1.1-slim}
    restart: unless-stopped
    expose: ["8080"]
    environment:
      XI_SIGNING_KEYS: ${XI_SIGNING_KEYS:?set XI_SIGNING_KEYS}
      XI_SIGNING_SALTS: ${XI_SIGNING_SALTS:?set XI_SIGNING_SALTS}
      XI_SOURCES: web
      XI_SOURCES_WEB_TYPE: http
      XI_SOURCES_WEB_ALLOW: ${XI_SOURCES_WEB_ALLOW:-images.example.com}
      XI_CACHE_RESULT_STORES: memory
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 40s
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }
