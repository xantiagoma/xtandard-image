# https://taskfile.dev
#
# Verification runs inside Docker (docker:* tasks) on the builder stage of the
# base image, so every contributor and agent uses the same libvips and Go.
#   task docker:lint docker:test
#   XI_BASE_IMAGE=xtandard-base:dev-builder task docker:test   # locally built base (WP-05)
#   task docker:base:slim docker:base:slim:check   # build + verify the slim base locally
#   task docker:base:full docker:base:full:check   # same for the full flavor (WP-70)
#   task docker:base:gpl docker:base:gpl:check     # same for the gpl flavor (WP-70b, GPL)
#   XI_BASE_IMAGE=xtandard-base:dev-full-builder task docker:test   # runs with -tags ffmpeg
#   task test:integration   # starts compose.test.yml services (RustFS, ...) and runs
#                           # -tags integration tests in the builder on their network
#   task acceptance         # black-box M1 suite against the app image $XI_IMAGE (WP-39)
#   task ts:check           # the TypeScript workspace (packages/*, ADR 0009); host Bun, no Docker
#   task clients:check clients:test   # the official clients (clients/*, ADR 0013); host toolchains
#   task deploy:platforms:check deploy:platforms:run   # deploy/ platform files and IaC (WP-149)
#
# The host tasks (lint, test, ...) run the same scripts with the toolchain
# pinned in .mise.toml (`mise install`); CI and the docker:* tasks are canonical.
version: "3"

includes:
  # Helm chart, Kustomize, observability checks (docs/OPERATIONS.md §8).
  deploy: ./deploy/Taskfile.yml

vars:
  BIN: bin/xtandard-image
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse HEAD 2>/dev/null || echo unknown
  LDFLAGS: -s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}}
  GO_BUILD: go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.BIN}} ./cmd/xtandard-image
  GO_TEST: go test -race -shuffle=on ./...

env:
  XI_BASE_IMAGE:
    sh: echo "${XI_BASE_IMAGE:-ghcr.io/xantiagoma/xtandard-image-base:slim-builder}"
  # Image flavor of XI_BASE_IMAGE (slim | full | gpl), from its tag unless
  # set: the full and gpl flavors ship FFmpeg, so their builds and tests use
  # -tags ffmpeg (video, ADR 0010). XI_GO_TAGS overrides the tag list.
  XI_IMAGE_FLAVOR:
    sh: |
      if [ -n "${XI_IMAGE_FLAVOR:-}" ]; then echo "$XI_IMAGE_FLAVOR"
      else case "${XI_BASE_IMAGE:-}" in *full*) echo full ;; *gpl*) echo gpl ;; *) echo slim ;; esac; fi
  XI_GO_TAGS:
    sh: |
      if [ -n "${XI_GO_TAGS+x}" ]; then echo "$XI_GO_TAGS"
      else case "${XI_IMAGE_FLAVOR:-${XI_BASE_IMAGE:-}}" in *full*|*gpl*) echo ffmpeg ;; *) echo "" ;; esac; fi

tasks:
  default:
    cmds: [task --list]

  # ---- inside Docker (canonical) -------------------------------------------

  docker:lint:
    desc: "Lint gates inside the base image builder ($XI_BASE_IMAGE)"
    cmds:
      - task: docker:run
        vars: { CMD: sh scripts/lint.sh }

  docker:test:
    desc: "Unit tests (-race -shuffle=on) inside the base image builder"
    cmds:
      - task: docker:run
        vars: { CMD: "{{.GO_TEST}}" }

  test:integration:
    desc: "Integration tests (-tags integration) in the builder against compose.test.yml services; `task test:integration -- ./internal/fetch/s3src/` narrows"
    vars:
      # One compose project per checkout, so concurrent worktrees never share
      # (or tear down) each other's services. The go caches are shared named
      # volumes: never `down -v` or `--remove-orphans` here.
      PROJECT:
        sh: echo "xi-test-$(basename "$PWD" | tr -c 'a-z0-9_\n-' '-')"
    cmds:
      - defer: docker compose -p {{.PROJECT}} -f compose.test.yml down
      - docker compose -p {{.PROJECT}} -f compose.test.yml run --rm -T test go test -race -shuffle=on -count=1 -tags integration {{.CLI_ARGS | default "./..."}}

  docker:build:
    desc: "Build the linux binary into bin/ inside the base image builder"
    cmds:
      - task: docker:run
        vars: { CMD: "{{.GO_BUILD}}" }

  docker:image:
    desc: "Alias of release:build"
    cmds: [task: release:build]

  smoke:
    desc: "End-to-end smoke test of xtandard-image:dev (compose.smoke.yml); XI_APP_BASE=xtandard-base:dev locally"
    deps: [release:build]
    cmds: [sh scripts/smoke.sh]

  acceptance:
    desc: "M1 acceptance suite (compose.acceptance.yml + test/acceptance, WP-39) against $XI_IMAGE (default xtandard-image:dev, build it with release:build; a registry ref is pulled); XI_ACC_RUN narrows"
    cmds: [sh scripts/acceptance.sh]

  quickstart:
    desc: "Run the README quick start verbatim (scripts/quickstart.sh) against a fresh build tagged xtandard-image; XI_APP_BASE=xtandard-base:dev locally"
    cmds:
      - XI_IMAGE=xtandard-image task release:build
      - sh scripts/quickstart.sh

  bench:
    desc: "Benchmark $XI_IMAGE (default xtandard-image:dev) against imgproxy OSS (bench/run.sh, docs/BENCHMARKS.md)"
    cmds: [sh bench/run.sh]

  # ---- release (docs/RELEASE.md) --------------------------------------------

  release:build:
    desc: "Build the release app image $XI_IMAGE (default xtandard-image:dev) for the host arch; XI_APP_BASE=xtandard-base:dev uses a local base (builder = <base>-builder), else the versions.sh base pinned by digest; the flavor (XI_FLAVOR build arg, labels) follows the base name or XI_APP_FLAVOR, and a full or gpl base (XI_APP_BASE=xtandard-base:dev-full) builds with -tags ffmpeg"
    vars:
      EPOCH:
        sh: git log -1 --pretty=%ct 2>/dev/null || echo 0
    cmds:
      - |
        if [ -n "${XI_APP_BASE:-}" ]; then
          builder="${XI_APP_BASE}-builder"
          runtime="${XI_APP_BASE}"
        else
          builder="$(sh scripts/base-image-ref.sh --digest builder)"
          runtime="$(sh scripts/base-image-ref.sh --digest runtime)"
        fi
        # The app flavor follows the base (XI_APP_FLAVOR overrides): it picks
        # the OCI labels, and full/gpl carry FFmpeg, so -tags ffmpeg (ADR 0010).
        flavor="${XI_APP_FLAVOR:-}"
        if [ -z "$flavor" ]; then
          case "$runtime" in *gpl*) flavor=gpl ;; *full*) flavor=full ;; *) flavor=slim ;; esac
        fi
        tags=""
        [ "$flavor" = slim ] || tags=ffmpeg
        echo "release:build: flavor $flavor, GO_TAGS='$tags', base $runtime"
        docker build -t "${XI_IMAGE:-xtandard-image:dev}" \
          --build-arg BASE_BUILDER="$builder" --build-arg BASE_RUNTIME="$runtime" \
          --build-arg XI_FLAVOR="$flavor" --build-arg GO_TAGS="$tags" \
          --build-arg VERSION={{.VERSION}} --build-arg COMMIT={{.COMMIT}} \
          --build-arg SOURCE_DATE_EPOCH={{.EPOCH}} .

  release:verify:
    desc: "Verify $XI_IMAGE (default xtandard-image:dev): version, config, ≤ 110 MB compressed, read-only + health, smoke"
    cmds: [sh scripts/verify-app-image.sh]

  pages:build:
    desc: "Assemble the GitHub Pages site (config schema, OpenAPI, index, Scalar page) into dist/pages/, as .github/workflows/pages.yml deploys it"
    cmds: [sh scripts/pages-build.sh]

  release:pgo:
    desc: "Refresh cmd/xtandard-image/default.pgo: 30 s CPU profile of $XI_IMAGE under the smoke load (build it first)"
    cmds: [sh scripts/pgo-profile.sh]

  docker:shell:
    desc: "Interactive shell in the base image builder with the repo at /src"
    interactive: true
    cmds:
      - docker compose -f compose.dev.yml run --rm dev bash

  docker:run:
    internal: true
    requires: { vars: [CMD] }
    cmds:
      - docker compose -f compose.dev.yml run --rm -T dev {{.CMD}}

  # ---- base image (docker/base, host architecture only) --------------------
  # Local tags: xtandard-base:dev[-builder] (slim), xtandard-base:dev-full[-builder],
  # xtandard-base:dev-gpl[-builder] (gpl: contains GPL software, ADR 0006).
  # Publishing (multi-arch, GHCR) is .github/workflows/base-image.yml.

  docker:base:slim:
    desc: "Build the slim base image for the host arch: xtandard-base:dev-builder and xtandard-base:dev"
    cmds:
      - task: docker:base:build
        vars: { TARGET: builder, TAG: xtandard-base:dev-builder }
      - task: docker:base:build
        vars: { TARGET: runtime, TAG: xtandard-base:dev }

  docker:base:slim:check:
    desc: "Licence gate self-test and verify-image.sh on the local slim pair"
    cmds:
      - bash docker/base/test-check-licenses.sh
      - bash docker/base/verify-image.sh --flavor slim xtandard-base:dev xtandard-base:dev-builder

  docker:base:full:
    desc: "Build the full base image (slim + FFmpeg LGPL + ONNX Runtime + models) for the host arch: xtandard-base:dev-full-builder and xtandard-base:dev-full"
    cmds:
      - task: docker:base:build
        vars: { TARGET: builder-full, TAG: xtandard-base:dev-full-builder }
      - task: docker:base:build
        vars: { TARGET: runtime-full, TAG: xtandard-base:dev-full }

  docker:base:full:check:
    desc: "Licence gate self-test and verify-image.sh (ffmpeg -buildconf, ldd, models, codecs, ONNX inference) on the local full pair"
    cmds:
      - bash docker/base/test-check-licenses.sh
      - bash docker/base/verify-image.sh --flavor full xtandard-base:dev-full xtandard-base:dev-full-builder

  docker:base:gpl:
    desc: "Build the gpl base image (full + FFmpeg rebuilt as GPL with x264/x265; contains GPL software, ADR 0006) for the host arch: xtandard-base:dev-gpl-builder and xtandard-base:dev-gpl"
    cmds:
      - task: docker:base:build
        vars: { TARGET: builder-gpl, TAG: xtandard-base:dev-gpl-builder }
      - task: docker:base:build
        vars: { TARGET: runtime-gpl, TAG: xtandard-base:dev-gpl }

  docker:base:gpl:check:
    desc: "Licence gate self-test and verify-image.sh --flavor gpl (GPL allowlist, LICENSE-GPL.md, H.264/HEVC round trips) on the local gpl pair"
    cmds:
      - bash docker/base/test-check-licenses.sh
      - bash docker/base/verify-image.sh --flavor gpl xtandard-base:dev-gpl xtandard-base:dev-gpl-builder

  docker:base:build:
    internal: true
    requires: { vars: [TARGET, TAG] }
    vars:
      ARCH:
        sh: case "$(uname -m)" in x86_64|amd64) echo amd64 ;; *) echo arm64 ;; esac
      VIPS:
        sh: . docker/base/versions.sh && echo "$VIPS_VERSION"
    cmds:
      - >-
        docker buildx build --platform linux/{{.ARCH}} --build-arg VIPS_VERSION={{.VIPS}}
        --target {{.TARGET}} --load -t {{.TAG}} docker/base

  # ---- on the host (mise toolchain) ----------------------------------------

  fmt:
    desc: Format Go code (gofumpt + goimports via golangci-lint)
    cmds: [golangci-lint fmt]

  lint:
    desc: golangci fmt/run, go vet, go fix -diff, tidy -diff and cgo placement
    cmds: [sh scripts/lint.sh]

  test:
    desc: Unit tests with the race detector and shuffled order
    cmds: ["{{.GO_TEST}}"]

  test:nocgo:
    desc: Build and test with CGO_ENABLED=0 (pure-Go packages must stay cgo-free)
    env: { CGO_ENABLED: "0" }
    cmds:
      - go build -o /dev/null ./...
      - go test -shuffle=on ./...

  build:
    desc: Build the binary with version info injected via -ldflags
    cmds: ["{{.GO_BUILD}}"]

  vuln:
    desc: govulncheck (fails on reachable vulnerabilities)
    cmds: [go tool -modfile=tools/go.mod govulncheck ./...]

  fuzz:
    desc: Run every fuzz target for FUZZTIME (default 60s)
    cmds: [sh scripts/fuzz.sh]

  ci:
    desc: Everything CI runs on a pull request, on the host
    cmds:
      - task: lint
      - task: test
      - task: test:nocgo
      - task: build
      - task: ts:check

  # ---- TypeScript workspace (packages/*, ADR 0009) -------------------------
  # Needs no libvips, so it runs on the host with the Bun pinned in .mise.toml
  # (the same steps as .github/workflows/ts.yml).

  ts:check:
    desc: "TypeScript workspace: frozen install, generated-types drift, typecheck (incl. type tests), bun test, npm licences, pack"
    cmds:
      - bun install --frozen-lockfile
      - bun run generate:check
      - bun run typecheck
      - bun run test
      - bun run licenses
      - bun run build
      - cd clients/typescript && bun pm pack --dry-run --quiet

  # ---- playground (internal/playground/assets, no build step) ---------------

  playground:test:
    desc: "Playground JavaScript unit tests (bun test): BlurHash/ThumbHash decoders, the code-snippet generator (Doc layout, printers, every language × case, the TypeScript snippets run)"
    cmds:
      - bun test scripts/playground-placeholder.test.ts scripts/playground-snippets.test.ts scripts/playground-snippets-printers.test.ts

  playground:snippets:
    desc: "Run every language's playground snippet with its official client (scratch projects in $XI_SNIPPETS_DIR, toolchains from each client's mise.toml; ONLY=python,go for some) and compare the printed URL with the TypeScript client's; slow, not part of CI"
    cmds:
      - bun scripts/playground-snippets-check.ts

  ts:fixtures:
    desc: "Regenerate the cross-language builder fixture: Go derives the cases from the golden tables, the TS builder writes the URLs, Go checks them"
    cmds:
      - go test ./internal/dialect/imgproxy -run TestBuilderFixture -count=1 -update
      - cd clients/typescript && XI_UPDATE_FIXTURES=1 bun test src/fixture.test.ts
      - go test ./internal/dialect/imgproxy -run TestBuilderFixture -count=1

  # ---- official clients (clients/*, ADR 0013) --------------------------------
  # Language-neutral spec (clients/spec/spec.json, from the Go catalogues),
  # conformance fixture (clients/spec/conformance.json) and one generator
  # (clients/codegen, Bun) with an emitter per language. Each client has its
  # own Taskfile with a `ci` task and pins its toolchain in its own mise.toml.

  clients:spec:
    desc: "Rewrite clients/spec/spec.json from the Go catalogues (internal/apidoc BuildClientSpec)"
    cmds:
      - go test ./internal/apidoc -run '^TestClientSpec$' -count=1 -update

  clients:generate:
    desc: "Regenerate every client's typed tables from clients/spec/spec.json; ONLY=python for one"
    cmds:
      - bun clients/codegen/generate.ts {{if .ONLY}}--only {{.ONLY}}{{end}}

  clients:fixtures:
    desc: "Fill clients/spec/conformance.json expect.value from the reference client (TypeScript), then check every URL with the server's parsers"
    cmds:
      - cd clients/typescript && XI_UPDATE_FIXTURES=1 bun test src/conformance.test.ts
      - go test ./internal/dialect/imgproxy -run '^TestConformanceFixture$' -count=1

  clients:check:
    desc: "No drift: spec.json against the catalogues, generated files against spec.json, the codegen tests and typechecks, every client's LICENSE is the root one"
    cmds:
      - go test ./internal/apidoc -run '^TestClientSpec' -count=1
      - go test ./internal/dialect/imgproxy -run '^TestConformanceFixture$' -count=1
      - bun clients/codegen/generate.ts --check
      - bun install --frozen-lockfile
      - bun test clients/codegen/test
      - clients/typescript/node_modules/.bin/tsc -p clients/codegen/tsconfig.json
      - bun scripts/check-root-manifests.ts
      - |
        for f in clients/*/LICENSE; do
          cmp -s LICENSE "$f" || { echo "$f differs from LICENSE" >&2; exit 1; }
        done

  clients:test:
    desc: "Run `task ci` of every client present (clients/*/Taskfile.yml)"
    cmds:
      - |
        for t in clients/*/Taskfile.yml; do
          d="$(dirname "$t")"
          echo "== $d"
          task -d "$d" ci
        done

  clients:python:test:
    desc: "The Python client: install, lint, types, tests, licences, build (clients/python)"
    cmds:
      - task -d clients/python ci

  # Platform deployment files and IaC (WP-149, docs/DEPLOY.md "Verification"). Pinned tools in
  # containers plus host Bun; no cloud account. WP-148's Kubernetes/Helm checks are separate.
  deploy:platforms:check:
    desc: "Validate deploy/ platform files (schemas, config validate in $XI_IMAGE), Terraform/OpenTofu modules, Pulumi/SST/CDK typechecks and synth, Node licences"
    cmds:
      - deploy/check/schemas.sh
      - deploy/check/terraform.sh
      - deploy/check/typescript.sh
      - bun deploy/check/licenses.ts

  deploy:platforms:run:
    desc: "Run the compose single and image/video split setups and a throwaway Swarm stack against $XI_IMAGE (default xtandard-image:main-gpl), then tear down"
    cmds:
      - deploy/check/compose-run.sh
