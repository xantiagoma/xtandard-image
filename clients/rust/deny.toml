# cargo-deny (https://embarkstudios.github.io/cargo-deny/): the licence
# policy of ADR 0006 / ADR 0013 over the runtime dependency closure, plus
# advisories, bans and sources. `task licenses` (or `cargo deny check`).
#
# Every feature (async and blocking) is checked; development dependencies are
# not shipped and are ignored.

[graph]
all-features = true
exclude-dev = true
# The server-side platforms the client supports. wasm32 is not one of them
# (a browser holds no signing keys); there rustls-platform-verifier would pull
# webpki-root-certs (CDLA-Permissive-2.0).
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[licenses]
# ADR 0006 allowlist: MIT, BSD, Apache-2.0, ISC (an "OR" expression passes
# when one side is allowed).
allow = ["MIT", "BSD-2-Clause", "BSD-3-Clause", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "ISC"]
confidence-threshold = 0.9
# The allowlist is the policy, not an inventory: an allowed licence nothing uses yet is fine.
unused-allowed-license = "allow"
# Documented exceptions, each limited to the crate that needs it (README "Licences").
exceptions = [
  # Unicode-3.0: the Unicode data tables of the ICU4X crates, which `url`
  # (through reqwest) uses for IDNA host names. The licence is permissive
  # (data and software; keep the notice); ADR 0006 lists it as acceptable data.
  { allow = ["Unicode-3.0"], crate = "unicode-ident" },
  { allow = ["Unicode-3.0"], crate = "icu_collections" },
  { allow = ["Unicode-3.0"], crate = "icu_locale_core" },
  { allow = ["Unicode-3.0"], crate = "icu_normalizer" },
  { allow = ["Unicode-3.0"], crate = "icu_normalizer_data" },
  { allow = ["Unicode-3.0"], crate = "icu_properties" },
  { allow = ["Unicode-3.0"], crate = "icu_properties_data" },
  { allow = ["Unicode-3.0"], crate = "icu_provider" },
  { allow = ["Unicode-3.0"], crate = "litemap" },
  { allow = ["Unicode-3.0"], crate = "potential_utf" },
  { allow = ["Unicode-3.0"], crate = "tinystr" },
  { allow = ["Unicode-3.0"], crate = "writeable" },
  { allow = ["Unicode-3.0"], crate = "yoke" },
  { allow = ["Unicode-3.0"], crate = "yoke-derive" },
  { allow = ["Unicode-3.0"], crate = "zerofrom" },
  { allow = ["Unicode-3.0"], crate = "zerofrom-derive" },
  { allow = ["Unicode-3.0"], crate = "zerotrie" },
  { allow = ["Unicode-3.0"], crate = "zerovec" },
  { allow = ["Unicode-3.0"], crate = "zerovec-derive" },
]

[licenses.private]
ignore = false

[advisories]
# RustSec advisory database; any unmaintained or vulnerable crate in the
# closure fails the check.
version = 2
yanked = "deny"

[bans]
multiple-versions = "allow"
wildcards = "deny"
deny = [
  # rustls with the ring provider is the only TLS stack: no OpenSSL, no aws-lc.
  { crate = "openssl-sys", reason = "the clients use rustls" },
  { crate = "native-tls", reason = "the clients use rustls" },
  { crate = "aws-lc-sys", reason = "rustls uses the ring provider (no OpenSSL-licensed C code, no cmake)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
