plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    # Generated by clients/codegen/emitters/ruby.ts (task clients:generate).
    - lib/xtandard_image/generated/**/*
    - vendor/**/*
    - dist/**/*

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: consistent_comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: consistent_comma

Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: consistent_comma

Layout/LineLength:
  Max: 130

# Keyword-heavy builder APIs mirror the other official clients.
Metrics/ParameterLists:
  Max: 16
  CountKeywordArgs: false

Metrics/MethodLength:
  Max: 30

Metrics/CyclomaticComplexity:
  Max: 14

Metrics/PerceivedComplexity:
  Max: 14

Metrics/ClassLength:
  Max: 250

Metrics/ModuleLength:
  Max: 250

Metrics/BlockLength:
  Exclude:
    - test/**/*

# The fixture-driven tests define one method per case.
Minitest/MultipleAssertions:
  Max: 12

Style/Documentation:
  Exclude:
    - test/**/*

# module_function modules are the natural home of the stateless helpers.
Style/ModuleFunction:
  EnforcedStyle: module_function

Naming/MethodParameterName:
  AllowedNames: [n, e, k, v, s, p, i, h, c, q, r, io, iv]

Minitest/EmptyLineBeforeAssertionMethods:
  Enabled: false

Metrics/AbcSize:
  Max: 40
  Exclude:
    - test/**/*
