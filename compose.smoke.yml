# End-to-end smoke test of the built app image (WP-00, WP-37): the image next
# to a static origin serving testdata/fixtures. Driven by scripts/smoke.sh,
# scripts/verify-app-image.sh and scripts/pgo-profile.sh.
#
#   task release:build XI_BASE=local   # or docker build … (see Dockerfile)
#   scripts/smoke.sh
name: xtandard-image-smoke

services:
  fixtures:
    # Caddy (Apache-2.0) as a plain static file server on port 80.
    image: caddy:2-alpine
    command: ["caddy", "file-server", "--root", "/srv", "--listen", ":80"]
    volumes:
      - ./testdata/fixtures:/srv:ro

  app:
    image: ${XI_IMAGE:-xtandard-image:dev}
    depends_on: [fixtures]
    environment:
      XI_DEV_MODE: "true"
      # The origin lives on the compose network (RFC 1918 address).
      XI_FETCH_ALLOW_PRIVATE_NETWORKS: "true"
      XI_ADMIN_ADDR: ":9090"
      XI_SERVER_SHUTDOWN_DELAY: "1s"
      XI_SERVER_SHUTDOWN_TIMEOUT: "10s"
      # scripts/pgo-profile.sh turns pprof on to collect default.pgo.
      XI_ADMIN_PPROF: ${XI_ADMIN_PPROF:-false}
    ports:
      - "127.0.0.1::8080"
      - "127.0.0.1::9090"
    # Production posture: read-only rootfs, writable tmpfs /tmp only.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    stop_grace_period: 20s
