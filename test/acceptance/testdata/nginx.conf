# Static origin for the acceptance suite (compose.acceptance.yml): serves
# testdata/fixtures at / and, throttled, at /slow/ so a request is still in
# flight when the drain test sends SIGTERM (20 KiB at 4 KiB/s is about 5 s).
server {
    listen 80;
    server_name _;
    root /srv;

    location / {
        try_files $uri =404;
    }

    # WP-99: hostile PostScript (internal/ghostscript/testdata/hostile).
    location /hostile/ {
        alias /srv-hostile/;
    }

    location /slow/ {
        alias /srv/;
        limit_rate 4k;
    }
}
