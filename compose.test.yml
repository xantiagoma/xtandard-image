# Backing services for `//go:build integration` tests (go-standards §8: docker
# compose, never testcontainers). Each source/cache backend adds its service
# here and its endpoint variables to the `test` runner below.
#
#   task test:integration                        # services + tests in the builder
#   task test:integration -- ./internal/fetch/s3src/
#
# The `test` runner is the builder stage of the base image (like compose.dev.yml)
# on the same compose network, so tests reach services by service name. The task
# uses a per-checkout project name (-p xi-test-<dir>) so worktrees never share or
# tear down each other's services. To run the tests on the host instead:
#
#   docker compose -p xi-test-host -f compose.test.yml up -d --wait rustfs
#   XI_TEST_S3_ENDPOINT=http://$(docker compose -p xi-test-host -f compose.test.yml port rustfs 9000) \
#     go test -tags integration ./internal/fetch/s3src/
#   docker compose -p xi-test-host -f compose.test.yml down
#
# FTP/SFTP on the host: sftp works through its ephemeral port
# (XI_TEST_SFTP_ADDR=127.0.0.1:$(... port sftp 22 | cut -d: -f2)), but ftp/ftps
# passive data ports are only reachable on the compose network, so run the
# ftpsrc tests through the task: `task test:integration -- ./internal/fetch/ftpsrc/`.
# The keys and certificate under internal/fetch/*/testdata are throwaway test
# credentials, committed on purpose.
#
# Host ports are ephemeral (127.0.0.1::9000) for the same reason. Never use
# `down -v` (the go caches are named volumes shared with compose.dev.yml).
name: xtandard-image-test

services:
  # RustFS (Apache-2.0): S3-compatible store for fetch/s3src. Pinned by
  # digest (multi-arch index: linux/amd64 + linux/arm64). It runs as uid
  # 10001, so the tmpfs data dir is owned by that uid.
  rustfs:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      RUSTFS_ACCESS_KEY: xitestaccess
      RUSTFS_SECRET_KEY: xitestsecret
    ports:
      - "127.0.0.1::9000"
    tmpfs:
      - /data:uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health/ready"]
      interval: 1s
      timeout: 2s
      retries: 30

  # fake-gcs-server (BSD-2-Clause): GCS JSON API emulator for fetch/gcssrc.
  fake-gcs:
    image: fsouza/fake-gcs-server:1.56.1
    command: ["-scheme", "http", "-port", "4443", "-external-url", "http://fake-gcs:4443", "-backend", "memory"]
    ports:
      - "127.0.0.1::4443"

  # Azurite (MIT): Azure Blob emulator for fetch/azuresrc (well-known dev account).
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--skipApiVersionCheck", "--loose"]
    ports:
      - "127.0.0.1::10000"

  # ftpsrc (WP-17): vsftpd, plain FTP, user xi/xipass, testdata/fixtures
  # read-only under /home/xi/fixtures. The client dials the control host for
  # passive data, so the test runner reaches ftp:21000-21009 on the compose
  # network; those ports are not published (fixed host ports would collide
  # between worktrees).
  ftp:
    image: delfer/alpine-ftp-server:latest
    environment:
      USERS: "xi|xipass|/home/xi|1000"
    # The image's own launcher backgrounds vsftpd and races on its pid; run
    # it in the foreground instead (the entrypoint still creates the users).
    command: >-
      vsftpd /etc/vsftpd/vsftpd.conf -obackground=NO
      -opasv_min_port=21000 -opasv_max_port=21009
    ports:
      - "127.0.0.1::21"
    volumes:
      - ./testdata/fixtures:/home/xi/fixtures:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 21"]
      interval: 1s
      timeout: 2s
      retries: 30

  # ftpsrc (WP-17): vsftpd with explicit TLS required (AUTH TLS, PROT P).
  ftps:
    image: delfer/alpine-ftp-server:latest
    environment:
      USERS: "xi|xipass|/home/xi|1000"
    command: >-
      vsftpd /etc/vsftpd/vsftpd.conf -obackground=NO
      -opasv_min_port=21010 -opasv_max_port=21019
      -ossl_enable=YES -orsa_cert_file=/certs/ftps.crt -orsa_private_key_file=/certs/ftps.key
      -oforce_local_logins_ssl=YES -oforce_local_data_ssl=YES
      -ossl_tlsv1=NO -ossl_sslv2=NO -ossl_sslv3=NO
    ports:
      - "127.0.0.1::21"
    volumes:
      - ./testdata/fixtures:/home/xi/fixtures:ro
      - ./internal/fetch/ftpsrc/testdata/ftps.crt:/certs/ftps.crt:ro
      - ./internal/fetch/ftpsrc/testdata/ftps.key:/certs/ftps.key:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 21"]
      interval: 1s
      timeout: 2s
      retries: 30

  # sftpsrc (WP-17): OpenSSH, user xi (password xipass or the committed
  # client key), chrooted to /home/xi, pinned host key from testdata.
  sftp:
    image: atmoz/sftp:alpine
    command: "xi:xipass:1001"
    ports:
      - "127.0.0.1::22"
    volumes:
      - ./testdata/fixtures:/home/xi/fixtures:ro
      - ./internal/fetch/sftpsrc/testdata/ssh_host_ed25519_key:/keys/ssh_host_ed25519_key:ro
      - ./internal/fetch/sftpsrc/testdata/ssh_host_ed25519_key.pub:/keys/ssh_host_ed25519_key.pub:ro
      - ./internal/fetch/sftpsrc/testdata/install-host-key.sh:/etc/sftp.d/install-host-key.sh:ro
      - ./internal/fetch/sftpsrc/testdata/id_ed25519.pub:/home/xi/.ssh/keys/id_ed25519.pub:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 1s
      timeout: 2s
      retries: 30

  test:
    image: ${XI_BASE_IMAGE:-ghcr.io/xantiagoma/xtandard-image-base:slim}
    working_dir: /src
    volumes:
      - .:/src
      - xi-gocache:/gocache
      - xi-gomodcache:/gomodcache
    environment:
      CGO_ENABLED: "1"
      CGO_CFLAGS_ALLOW: -Xpreprocessor
      GOCACHE: /gocache/go-build
      GOMODCACHE: /gomodcache
      GOTOOLCHAIN: local
      GOFLAGS: -buildvcs=false
      XI_TEST_S3_ENDPOINT: http://rustfs:9000
      XI_TEST_S3_ACCESS_KEY_ID: xitestaccess
      XI_TEST_S3_SECRET_ACCESS_KEY: xitestsecret
      XI_TEST_GCS_ENDPOINT: http://fake-gcs:4443/storage/v1/
      XI_TEST_AZURITE_ENDPOINT: http://azurite:10000/devstoreaccount1
      XI_TEST_FTP_ADDR: ftp:21
      XI_TEST_FTPS_ADDR: ftps:21
      XI_TEST_SFTP_ADDR: sftp:22
    depends_on:
      rustfs:
        condition: service_healthy
      fake-gcs:
        condition: service_started
      azurite:
        condition: service_started
      ftp:
        condition: service_healthy
      ftps:
        condition: service_healthy
      sftp:
        condition: service_healthy

# Shared with compose.dev.yml so builds stay warm.
volumes:
  xi-gocache:
    name: xi-gocache
  xi-gomodcache:
    name: xi-gomodcache
