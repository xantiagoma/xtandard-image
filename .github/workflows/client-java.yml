name: client-java

# The Java client (clients/java, ADR 0013): Spotless (google-java-format),
# javac with Error Prone and NullAway (warnings are errors), JUnit (conformance
# fixture, builder fixture, shared vectors, unit and client tests) on every
# supported runtime, the licence check, and the jar, sources jar and javadoc
# jar. JDK 21 builds (--release 17); the matrix JDK runs the tests. Runs when
# the client, the shared spec and fixtures, or this workflow change.
#
# The jobs run only when the repository variable XI_CLIENTS_WORKFLOW is "enabled".
# Locally: `task -d clients/java ci`.
on:
  push:
    branches: [main]
    paths: &paths
      - 'clients/java/**'
      - 'clients/spec/**'
      - 'testdata/urls/**'
      - 'testdata/security/**'
      - '.github/workflows/client-java.yml'
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: client-java-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: clients/java

jobs:
  test:
    name: java ${{ matrix.java }}
    if: vars.XI_CLIENTS_WORKFLOW == 'enabled'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v7
      # The last version listed is the default JAVA_HOME (the build JDK);
      # the matrix version runs the tests through -Dtest.jvm.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            21
          cache: maven
          cache-dependency-path: clients/java/pom.xml
      # Maven itself, pinned by version and SHA-512 (stCarolas/setup-maven
      # failed the job on Maven Central's intermittent 404s: no retry).
      - name: Maven
        env:
          MAVEN_VERSION: '3.9.16' # = clients/java/mise.toml
          MAVEN_SHA512: 831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
        run: |
          tgz="$RUNNER_TEMP/maven.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors -o "$tgz" \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          echo "${MAVEN_SHA512}  $tgz" | sha512sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin/mvn" -v
      - name: Test JVM
        run: echo "TEST_JVM=$(printenv JAVA_HOME_${{ matrix.java }}_X64)/bin/java" >> "$GITHUB_ENV"
      - run: mvn -B spotless:check
      - run: mvn -B verify "-Dtest.jvm=$TEST_JVM"
      - run: mvn -B -q dependency:list -DincludeScope=runtime -DoutputFile=target/dependencies-runtime.txt
      - run: mvn -B -q dependency:list -DincludeScope=provided -DoutputFile=target/dependencies-provided.txt
      - run: java scripts/CheckLicenses.java target/dependencies-runtime.txt target/dependencies-provided.txt
