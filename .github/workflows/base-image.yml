name: base-image

# Builds docker/base natively on amd64 and arm64 runners, for both flavors, pushes each
# architecture by digest, then assembles multi-arch manifests:
#   ghcr.io/xantiagoma/xtandard-image-base:<vips>-r<N>-slim          (runtime)
#   ghcr.io/xantiagoma/xtandard-image-base:slim
#   ghcr.io/xantiagoma/xtandard-image-base:<vips>-r<N>-slim-builder  (Go + libvips dev)
#   ghcr.io/xantiagoma/xtandard-image-base:slim-builder
#   ghcr.io/xantiagoma/xtandard-image-base:<vips>-r<M>-full          (+ FFmpeg LGPL, ONNX Runtime, models)
#   ghcr.io/xantiagoma/xtandard-image-base:full
#   ghcr.io/xantiagoma/xtandard-image-base:<vips>-r<M>-full-builder
#   ghcr.io/xantiagoma/xtandard-image-base:full-builder
# N is XI_BASE_REVISION (versions.sh), M is XI_BASE_FULL_REVISION (versions-full.sh).
# Pull requests build and verify both architectures and flavors without pushing.

on:
  push:
    branches: [main]
    paths:
      - docker/base/**
      - .github/workflows/base-image.yml
  pull_request:
    paths:
      - docker/base/**
      - .github/workflows/base-image.yml
  workflow_dispatch:
  schedule:
    # Weekly rebuild picks up Ubuntu security updates (ADR 0005).
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: base-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/xantiagoma/xtandard-image-base
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  license-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Lint shell scripts
        run: shellcheck -x -P docker/base docker/base/*.sh
      - name: License gate self-test
        run: docker/base/test-check-licenses.sh

  meta:
    runs-on: ubuntu-24.04
    outputs:
      vips: ${{ steps.meta.outputs.vips }}
      slim-tag: ${{ steps.meta.outputs.slim-tag }}
      full-tag: ${{ steps.meta.outputs.full-tag }}
      epoch: ${{ steps.meta.outputs.epoch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - id: meta
        run: |
          source docker/base/versions.sh
          source docker/base/versions-full.sh
          {
            echo "vips=${VIPS_VERSION}"
            echo "slim-tag=${VIPS_VERSION}-r${XI_BASE_REVISION}-slim"
            echo "full-tag=${VIPS_VERSION}-r${XI_BASE_FULL_REVISION}-full"
            echo "epoch=$(git log -1 --pretty=%ct)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: [license-gate, meta]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        flavor: [slim, full]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - flavor: slim
            runtime-target: runtime
            builder-target: builder
          - flavor: full
            runtime-target: runtime-full
            builder-target: builder-full
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.epoch }}
      TAG: ${{ matrix.flavor == 'full' && needs.meta.outputs.full-tag || needs.meta.outputs.slim-tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build runtime
        id: runtime
        uses: docker/build-push-action@v7
        with:
          context: docker/base
          target: ${{ matrix.runtime-target }}
          platforms: ${{ matrix.platform }}
          build-args: VIPS_VERSION=${{ needs.meta.outputs.vips }}
          labels: org.opencontainers.image.version=${{ env.TAG }}
          # The full stages start from the slim deps stage, so full also reads the slim cache.
          cache-from: |
            type=gha,scope=base-${{ matrix.flavor }}-${{ matrix.arch }}-runtime
            type=gha,scope=base-${{ matrix.flavor }}-${{ matrix.arch }}-builder
            type=gha,scope=base-slim-${{ matrix.arch }}-builder
          cache-to: type=gha,mode=max,scope=base-${{ matrix.flavor }}-${{ matrix.arch }}-runtime
          outputs: >-
            ${{ env.PUSH == 'true'
              && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE)
              || format('type=docker,name=xtandard-base:ci-{0}', matrix.flavor) }}

      - name: Build builder
        id: builder
        uses: docker/build-push-action@v7
        with:
          context: docker/base
          target: ${{ matrix.builder-target }}
          platforms: ${{ matrix.platform }}
          build-args: VIPS_VERSION=${{ needs.meta.outputs.vips }}
          labels: org.opencontainers.image.version=${{ env.TAG }}-builder
          cache-from: |
            type=gha,scope=base-${{ matrix.flavor }}-${{ matrix.arch }}-builder
            type=gha,scope=base-${{ matrix.flavor }}-${{ matrix.arch }}-runtime
            type=gha,scope=base-slim-${{ matrix.arch }}-builder
          cache-to: type=gha,mode=max,scope=base-${{ matrix.flavor }}-${{ matrix.arch }}-builder
          outputs: >-
            ${{ env.PUSH == 'true'
              && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE)
              || format('type=docker,name=xtandard-base:ci-{0}-builder', matrix.flavor) }}

      - name: Verify images
        env:
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          BUILDER_DIGEST: ${{ steps.builder.outputs.digest }}
        run: |
          if [ "$PUSH" = "true" ]; then
            docker/base/verify-image.sh --flavor "${{ matrix.flavor }}" "$IMAGE@$RUNTIME_DIGEST" "$IMAGE@$BUILDER_DIGEST"
          else
            docker/base/verify-image.sh --flavor "${{ matrix.flavor }}" \
              "xtandard-base:ci-${{ matrix.flavor }}" "xtandard-base:ci-${{ matrix.flavor }}-builder"
          fi

      - name: Export digests
        if: env.PUSH == 'true'
        env:
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          BUILDER_DIGEST: ${{ steps.builder.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests/runtime" "$RUNNER_TEMP/digests/builder"
          touch "$RUNNER_TEMP/digests/runtime/${RUNTIME_DIGEST#sha256:}"
          touch "$RUNNER_TEMP/digests/builder/${BUILDER_DIGEST#sha256:}"

      - name: Upload digests
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.flavor }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: [meta, build]
    strategy:
      matrix:
        flavor: [slim, full]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.flavor }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        env:
          TAG: ${{ matrix.flavor == 'full' && needs.meta.outputs.full-tag || needs.meta.outputs.slim-tag }}
          FLAVOR: ${{ matrix.flavor }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:$FLAVOR" \
            $(printf "$IMAGE@sha256:%s " $(ls runtime))
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            -t "$IMAGE:$TAG-builder" \
            -t "$IMAGE:$FLAVOR-builder" \
            $(printf "$IMAGE@sha256:%s " $(ls builder))

      - name: Inspect
        env:
          TAG: ${{ matrix.flavor == 'full' && needs.meta.outputs.full-tag || needs.meta.outputs.slim-tag }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$TAG"
          docker buildx imagetools inspect "$IMAGE:$TAG-builder"
