name: release

# Publishes the app image in its three flavors (WP-37, WP-118, docs/RELEASE.md):
#   1. meta     version, commit, SOURCE_DATE_EPOCH; the slim, full and gpl base
#               images from docker/base/versions*.sh resolved to digests
#   2. build    per flavor (slim, full, gpl) natively on amd64 + arm64 (no
#               QEMU): build on the base of the same flavor (full and gpl with
#               GO_TAGS=ffmpeg, XI_FLAVOR for the OCI labels), push by digest,
#               verify (scripts/verify-app-image.sh: version, flavor labels,
#               health, size ≤ 110 MB slim / 170 MB full and gpl, read-only
#               rootfs, smoke), M1 acceptance suite against the pushed digest
#               (scripts/acceptance.sh), SBOM (syft) + SLSA provenance attached
#               to each per-arch manifest, unstripped binary kept
#   3. merge    per flavor: multi-arch manifest, cosign keyless signature
#               (recursive), provenance on the index. Tags:
#                 slim  <ver>-slim, <ver>  (+ slim, latest for stable releases)
#                 full  <ver>-full         (+ full for stable releases)
#                 gpl   <ver>-gpl          (+ gpl for stable releases)
#   4. release  GitHub release with the unstripped binaries, the SBOMs and
#               SHA256SUMS (tag pushes only)
#
#   ghcr.io/xantiagoma/xtandard-image:{<ver>-slim,<ver>,slim,latest,<ver>-full,full,<ver>-gpl,gpl}
#
# Edge images (WP-155): every push to main that touches more than docs and
# clients runs the same meta, build and merge jobs (same gates, signing,
# provenance and SBOM) with an edge version (meta: <tag>.main.<n>.g<sha7>
# after a prerelease tag, X.Y.<Z+1>-main.<n>.g<sha7> after a stable one) and
# edge tags instead of version tags. release and npm are skipped:
#   slim  main, main-slim, sha-<sha7>, sha-<sha7>-slim
#   full  main-full, sha-<sha7>-full
#   gpl   main-gpl, sha-<sha7>-gpl
# latest, slim, full and gpl stay on the newest stable release. A newer push
# to main cancels the edge run in progress; tag releases are never cancelled.
#
# Nothing is tagged unless all six builds passed verify-app-image.sh and the
# acceptance suite: merge needs the whole build matrix.

on:
  push:
    tags: ["v*"]
    # Edge images. Path filters apply to the branch push only, never to tags.
    # None of these paths is in the image or used to verify it (.dockerignore).
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - clients/**
      - packages/**
      - bench/**
      - package.json
      - bun.lock
      - tsconfig.base.json
      - Package.swift
      - composer.json
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, e.g. v0.1.0 (must be an existing tag unless dry_run)
        required: true
      dry_run:
        description: Build and verify every flavor on both architectures without pushing
        type: boolean
        default: true

permissions:
  contents: read

# An edge run on main is superseded by the next push; a release never is.
# Edge has its own group, so a push to main never cancels a dispatched run.
concurrency:
  group: ${{ github.event_name == 'push' && github.ref_type == 'branch' && 'release-edge' || format('release-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

env:
  IMAGE: ghcr.io/xantiagoma/xtandard-image
  PUSH: ${{ github.event_name == 'push' || !inputs.dry_run }}
  # A push to main (the only branch in the trigger): edge images, no release.
  EDGE: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

jobs:
  meta:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      edge: ${{ steps.meta.outputs.edge }}
      short: ${{ steps.meta.outputs.short }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      commit: ${{ steps.meta.outputs.commit }}
      epoch: ${{ steps.meta.outputs.epoch }}
      created: ${{ steps.meta.outputs.created }}
      slim_builder: ${{ steps.base.outputs.slim_builder }}
      slim_runtime: ${{ steps.base.outputs.slim_runtime }}
      full_builder: ${{ steps.base.outputs.full_builder }}
      full_runtime: ${{ steps.base.outputs.full_runtime }}
      gpl_builder: ${{ steps.base.outputs.gpl_builder }}
      gpl_runtime: ${{ steps.base.outputs.gpl_runtime }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.version || github.ref }}
          # Edge: the whole history with tags, for the commit count since the
          # newest release tag. A release keeps the shallow checkout.
          fetch-depth: ${{ github.event_name == 'push' && github.ref_type == 'branch' && '0' || '1' }}

      - id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          semver='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          short=""
          if [ "$EDGE" = "true" ]; then
            # Edge version: a semver prerelease that sorts after the newest
            # release tag reachable from main and before the next release:
            #   after v0.1.0-rc.2 (prerelease):  0.1.0-rc.2.main.<n>.g<sha7>
            #   after v0.1.0 (stable):           0.1.1-main.<n>.g<sha7>
            # <n> is the number of commits since that tag, so it only grows
            # on main; the g (as in git describe) keeps an all-digit sha a
            # valid identifier.
            short="$(git rev-parse HEAD | cut -c1-7)"
            base="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)"
            if printf '%s\n' "$base" | grep -Eq "$semver"; then
              n="$(git rev-list --count "$base..HEAD")"
            else
              base=v0.0.0
              n="$(git rev-list --count HEAD)"
            fi
            base="${base#v}"
            case "$base" in
              *-*) version="$base.main.$n.g$short" ;;
              *)
                IFS=. read -r major minor patch <<< "$base"
                version="$major.$minor.$((patch + 1))-main.$n.g$short"
                ;;
            esac
            tag="$GITHUB_REF_NAME"
            prerelease=true
          else
            tag="${INPUT_VERSION:-$GITHUB_REF_NAME}"
            if ! printf '%s\n' "$tag" | grep -Eq "$semver"; then
              echo "::error::version '$tag' is not v<major>.<minor>.<patch>[-prerelease]"
              exit 1
            fi
            version="${tag#v}"
            prerelease=false
            case "$version" in *-*) prerelease=true ;; esac
          fi
          {
            echo "edge=$EDGE"
            echo "short=$short"
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "commit=$(git rev-parse HEAD)"
            epoch="$(git log -1 --pretty=%ct)"
            echo "epoch=$epoch"
            echo "created=$(date -u -d "@$epoch" +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Dockerfile base defaults match versions.sh
        run: scripts/base-image-ref.sh --check

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # <vips>-r<N>-<flavor>[-builder] from versions.sh, versions-full.sh and
      # versions-gpl.sh, pinned by digest for the whole run.
      - name: Resolve base images to digests
        id: base
        run: |
          for flavor in slim full gpl; do
            for target in builder runtime; do
              echo "${flavor}_${target}=$(scripts/base-image-ref.sh --flavor "$flavor" --digest "$target")"
            done
          done >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    strategy:
      fail-fast: true
      matrix:
        flavor: [slim, full, gpl]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          # full and gpl ship FFmpeg (ADR 0010): the app links it.
          - flavor: slim
            go_tags: ""
          - flavor: full
            go_tags: ffmpeg
          - flavor: gpl
            go_tags: ffmpeg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign attest + GitHub attestations
      attestations: write
    env:
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.epoch }}
      BUILD_ARGS: |
        BASE_BUILDER=${{ matrix.flavor == 'gpl' && needs.meta.outputs.gpl_builder || matrix.flavor == 'full' && needs.meta.outputs.full_builder || needs.meta.outputs.slim_builder }}
        BASE_RUNTIME=${{ matrix.flavor == 'gpl' && needs.meta.outputs.gpl_runtime || matrix.flavor == 'full' && needs.meta.outputs.full_runtime || needs.meta.outputs.slim_runtime }}
        XI_FLAVOR=${{ matrix.flavor }}
        GO_TAGS=${{ matrix.go_tags }}
        VERSION=${{ needs.meta.outputs.version }}
        COMMIT=${{ needs.meta.outputs.commit }}
      LOCAL_REF: xtandard-image:release-${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.commit }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SOURCE_DATE_EPOCH (env) is forwarded by buildx as a build arg and
      # clamps layer timestamps (rewrite-timestamp): reproducible images.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          build-args: ${{ env.BUILD_ARGS }}
          labels: org.opencontainers.image.created=${{ needs.meta.outputs.created }}
          provenance: false # SLSA provenance comes from actions/attest-build-provenance
          sbom: false # syft SBOM is attested below
          cache-from: type=gha,scope=app-${{ matrix.flavor }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.flavor }}-${{ matrix.arch }}
          outputs: >-
            ${{ env.PUSH == 'true'
              && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true', env.IMAGE)
              || format('type=docker,name={0},rewrite-timestamp=true', env.LOCAL_REF) }}

      # Size limit by flavor (110 MB slim, 170 MB full/gpl) and the flavor
      # labels are checked by the script.
      - name: Verify image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          XI_EXPECT_VERSION: ${{ needs.meta.outputs.version }}
          XI_EXPECT_FLAVOR: ${{ matrix.flavor }}
        run: |
          ref="$LOCAL_REF"
          if [ "$PUSH" = "true" ]; then
            ref="$IMAGE@$DIGEST"
            docker pull "$ref"
          fi
          scripts/verify-app-image.sh "$ref"

      # M1 release gate (WP-39): the acceptance suite against the pushed
      # digest on this architecture and flavor. merge (which tags) needs the
      # whole build matrix, so nothing is tagged unless all six pass.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Acceptance suite
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GOTOOLCHAIN: local
        run: |
          ref="$LOCAL_REF"
          if [ "$PUSH" = "true" ]; then
            ref="$IMAGE@$DIGEST"
          fi
          XI_IMAGE="$ref" scripts/acceptance.sh

      # xtandard-image-<ver>-<flavor>-linux-<arch>.debug
      - name: Export unstripped binary
        uses: docker/build-push-action@v7
        with:
          context: .
          target: debug
          platforms: ${{ matrix.platform }}
          build-args: ${{ env.BUILD_ARGS }}
          provenance: false
          cache-from: type=gha,scope=app-${{ matrix.flavor }}-${{ matrix.arch }}
          outputs: type=local,dest=${{ runner.temp }}/debug

      - uses: actions/upload-artifact@v7
        with:
          name: debug-${{ matrix.flavor }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/debug/*
          if-no-files-found: error
          retention-days: ${{ env.EDGE == 'true' && 14 || 90 }}

      - name: SBOM (syft)
        if: env.PUSH == 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-${{ matrix.flavor }}-${{ matrix.arch }}.spdx.json
          artifact-name: sbom-${{ matrix.flavor }}-${{ matrix.arch }}.spdx.json
          upload-release-assets: false

      - uses: sigstore/cosign-installer@v4.1.2
        if: env.PUSH == 'true'

      - name: Attest SBOM (cosign keyless)
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SBOM: ${{ runner.temp }}/sbom-${{ matrix.flavor }}-${{ matrix.arch }}.spdx.json
        run: cosign attest --yes --type spdxjson --predicate "$SBOM" "$IMAGE@$DIGEST"

      - name: SLSA provenance (per-arch manifest)
        if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Export digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        if: env.PUSH == 'true'
        with:
          name: digests-${{ matrix.flavor }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name == 'push' || !inputs.dry_run
    needs: [meta, build]
    strategy:
      fail-fast: false # a tagged flavor stays tagged; re-run the failed leg
      matrix:
        flavor: [slim, full, gpl]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign + GitHub attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.flavor }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        id: manifest
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          SHORT: ${{ needs.meta.outputs.short }}
          FLAVOR: ${{ matrix.flavor }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          annotations=""
          if [ "$EDGE" = "true" ]; then
            # Edge: the immutable sha-<sha7>-<flavor> and the moving
            # main-<flavor>; sha-<sha7> and main name slim. The index
            # annotation keeps the GHCR package linked to the repository.
            primary="sha-$SHORT-$FLAVOR"
            tags="-t $IMAGE:$primary -t $IMAGE:main-$FLAVOR"
            if [ "$FLAVOR" = slim ]; then tags="$tags -t $IMAGE:sha-$SHORT -t $IMAGE:main"; fi
            annotations="--annotation index:org.opencontainers.image.source=$SOURCE"
          else
            # <ver>-<flavor> always; <ver> and latest name slim (the default
            # flavor). The moving tags (latest, slim, full, gpl) only for
            # stable releases.
            primary="$VERSION-$FLAVOR"
            tags="-t $IMAGE:$primary"
            if [ "$FLAVOR" = slim ]; then tags="$tags -t $IMAGE:$VERSION"; fi
            if [ "$PRERELEASE" = "false" ]; then
              tags="$tags -t $IMAGE:$FLAVOR"
              if [ "$FLAVOR" = slim ]; then tags="$tags -t $IMAGE:latest"; fi
            fi
          fi
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags $annotations \
            $(printf "$IMAGE@sha256:%s " $(ls))
          digest="$(docker buildx imagetools inspect "$IMAGE:$primary" | awk '/^Digest:/ { print $2; exit }')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE@$digest"
          mkdir -p "$RUNNER_TEMP/index"
          echo "$digest" > "$RUNNER_TEMP/index/$FLAVOR"

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Sign (cosign keyless, index and per-arch manifests)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes --recursive "$IMAGE@$DIGEST"

      - name: SLSA provenance (multi-arch index)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - uses: actions/upload-artifact@v7
        with:
          name: index-${{ matrix.flavor }}
          path: ${{ runner.temp }}/index/*
          if-no-files-found: error
          retention-days: 1

  release:
    # The GitHub release, once every flavor is tagged and signed: a tag push, or
    # a non-dry dispatch re-publishing an existing tag. Not for edge images.
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    needs: [meta, merge]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # GitHub release
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/assets
          pattern: debug-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/assets
          pattern: sbom-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/index
          pattern: index-*
          merge-multiple: true

      - name: GitHub release (unstripped binaries, SBOMs)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          notes="Images (verify with \`cosign verify\`, see docs/RELEASE.md):"
          for flavor in slim full gpl; do
            digest="$(cat "$RUNNER_TEMP/index/$flavor")"
            notes="$notes
          - \`$IMAGE:$VERSION-$flavor\` (\`$IMAGE@$digest\`)"
          done
          notes="$notes

          \`$IMAGE:$VERSION\` is the slim flavor. The gpl flavor contains GPL and AGPL software (see its /opt/xtandard/share/licenses/LICENSE-GPL.md)."
          cd "$RUNNER_TEMP/assets"
          sha256sum -- * > SHA256SUMS
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          # A re-run for a tag released before (a local release, or a retry) replaces the
          # assets and the image list; it keeps the release itself.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber -- *
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$notes"
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $flags \
              --notes "$notes" -- *
          fi

  npm:
    # @xtandard/image (clients/typescript, WP-84, ADR 0009 decision 6):
    # published after the image, at the same version, so the package's
    # generated types always describe a released server. npm trusted
    # publishing (OIDC, no token) with a provenance attestation.
    # Runs when the repository variable XI_NPM_PUBLISH is "enabled": on a tag
    # push, or on a non-dry dispatch re-publishing an existing tag (a version
    # already on npm is skipped). The trusted publisher on npmjs.com names this
    # file, release.yml (docs/RELEASE.md "npm package").
    if: vars.XI_NPM_PUBLISH == 'enabled' && ((github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
    needs: [meta, merge]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5 # npm CLI for `npm publish --provenance`
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm 11.5.1 or later (trusted publishing)
        run: npm install -g npm@11 && npm --version
      - run: bun install --frozen-lockfile
      - name: Check (drift, types, tests, licences)
        run: bun run generate:check && bun run typecheck && bun run test && bun run licenses
      - name: Version from the tag
        working-directory: clients/typescript
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: npm pkg set version="$VERSION"
      - name: Pack
        working-directory: clients/typescript
        run: bun pm pack --destination "$RUNNER_TEMP/npm"
      - name: Publish with provenance
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          if npm view "@xtandard/image@$VERSION" version >/dev/null 2>&1; then
            echo "@xtandard/image@$VERSION is already on npm; nothing to publish"
            exit 0
          fi
          dist_tag=latest
          if [ "$PRERELEASE" = "true" ]; then dist_tag=next; fi
          npm publish "$RUNNER_TEMP/npm/xtandard-image-$VERSION.tgz" \
            --provenance --access public --tag "$dist_tag"
