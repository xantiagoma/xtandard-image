# M1 acceptance suite (WP-39): a black-box end-to-end run against ANY app
# image, configured through environment variables only, like a deployment.
# Driven by scripts/acceptance.sh (`task acceptance`), which generates fresh
# signing/encryption keys per run, seeds RustFS and runs the Go suite in
# test/acceptance (`-tags acceptance`) on the host against the published
# ports.
#
#   XI_IMAGE=ghcr.io/xantiagoma/xtandard-image:slim scripts/acceptance.sh
#
# Services:
#   fixtures   nginx (BSD-2-Clause) serving testdata/fixtures; /slow/ is
#              throttled for the SIGTERM drain test
#   rustfs     S3 origin (RustFS, Apache-2.0, like compose.test.yml);
#              s3-seed uploads testdata/fixtures into bucket "fixtures"
#              (curl SigV4, test/acceptance/testdata/seed-s3.sh)
#   app        the image under test: signing + encryption keys, http, s3 and
#              fs sources, presets, fallback image, HEIC encode, imgproxy
#              mount "/" with unsigned policy allow, query mount "/q/" with
#              unsigned policy restricted, playground on the admin
#              listener (WP-80)
#   app-tiny   same image, one worker and no queue: 429 under load, then
#              SIGTERM drain (the suite stops it)
#
# Host ports are ephemeral (127.0.0.1::8080) so worktrees and CI legs never
# collide; the script passes them to the suite.
name: xtandard-image-acceptance

x-app: &app
  image: ${XI_IMAGE:-xtandard-image:dev}
  # Production posture (docs/RELEASE.md "Running read-only").
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 30s

services:
  fixtures:
    image: nginx:1.29-alpine
    volumes:
      - ./testdata/fixtures:/srv:ro
      - ./test/acceptance/testdata/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/png/palette.png"]
      interval: 1s
      timeout: 2s
      retries: 30

  # RustFS (Apache-2.0), same pinned image as compose.test.yml; runs as uid
  # 10001, hence the tmpfs owner.
  rustfs:
    image: &rustfs rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      RUSTFS_ACCESS_KEY: xitestaccess
      RUSTFS_SECRET_KEY: xitestsecret
    tmpfs:
      - /data:uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health/ready"]
      interval: 1s
      timeout: 2s
      retries: 30

  # One-shot: `docker compose run --rm s3-seed` (scripts/acceptance.sh).
  # Reuses the RustFS image for its curl (SigV4 signing built in), so no
  # extra image is pulled.
  s3-seed:
    image: *rustfs
    profiles: [seed]
    entrypoint: ["sh", "/seed-s3.sh"]
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: fixtures
      S3_ACCESS_KEY: xitestaccess
      S3_SECRET_KEY: xitestsecret
    volumes:
      - ./testdata/fixtures:/fixtures:ro
      - ./test/acceptance/testdata/seed-s3.sh:/seed-s3.sh:ro
    depends_on:
      rustfs:
        condition: service_healthy

  app:
    <<: *app
    depends_on:
      fixtures:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    volumes:
      - ./testdata/fixtures:/data:ro
    environment:
      XI_ADMIN_ADDR: ":9090"
      XI_OBSERVABILITY_DEBUG_HEADERS: "true"
      # Signing: keys set, signatures verified, but not required, so unsigned
      # URLs fall under each mount's unsigned policy.
      XI_SIGNING_KEYS: ${XI_ACC_SIGNING_KEY:?generated by scripts/acceptance.sh}
      XI_SIGNING_SALTS: ${XI_ACC_SIGNING_SALT:?generated by scripts/acceptance.sh}
      XI_SIGNING_REQUIRED: "false"
      XI_ENCRYPTION_KEYS: ${XI_ACC_ENCRYPTION_KEY:?generated by scripts/acceptance.sh}
      XI_SECURITY_UNSIGNED_POLICY: restricted
      XI_DIALECTS_IMGPROXY_UNSIGNED_POLICY: allow
      XI_DIALECTS_QUERY_ENABLED: "true"
      XI_DIALECTS_QUERY_UNSIGNED_POLICY: restricted
      # Sources: http origin (allowlisted host), RustFS bucket, local files.
      XI_SOURCES: origin,assets,local
      XI_SOURCES_ORIGIN_TYPE: http
      XI_SOURCES_ORIGIN_ALLOW: fixtures
      XI_SOURCES_ASSETS_TYPE: s3
      XI_SOURCES_ASSETS_ENDPOINT: http://rustfs:9000
      XI_SOURCES_ASSETS_REGION: us-east-1
      XI_SOURCES_ASSETS_FORCE_PATH_STYLE: "true"
      XI_SOURCES_ASSETS_BUCKETS: fixtures
      XI_SOURCES_ASSETS_BUCKET: fixtures
      XI_SOURCES_ASSETS_ACCESS_KEY_ID: xitestaccess
      XI_SOURCES_ASSETS_SECRET_ACCESS_KEY: xitestsecret
      XI_SOURCES_LOCAL_TYPE: fs
      XI_SOURCES_LOCAL_ROOT: /data
      # The origin and RustFS live on the compose network (RFC 1918).
      XI_FETCH_ALLOW_PRIVATE_NETWORKS: "true"
      XI_PRESETS: thumb=rs:fill:100:100/g:ce
      XI_FORMATS_HEIC_ENCODE: "true"
      XI_FALLBACK_SOURCE: local:///png/rgba8.png
      XI_FALLBACK_STATUS: "200"
      XI_FALLBACK_TTL: 30s
      # WP-80: the playground on the admin listener only.
      XI_PLAYGROUND_ENABLED: "true"
    ports:
      - "127.0.0.1::8080"
      - "127.0.0.1::9090"

  app-tiny:
    <<: *app
    depends_on:
      fixtures:
        condition: service_healthy
    environment:
      XI_ADMIN_ADDR: ":9090"
      XI_SOURCES: origin
      XI_SOURCES_ORIGIN_TYPE: http
      XI_SOURCES_ORIGIN_ALLOW: fixtures
      XI_FETCH_ALLOW_PRIVATE_NETWORKS: "true"
      XI_FETCH_TIMEOUT: 20s
      XI_SECURITY_UNSIGNED_POLICY: allow
      # One worker, no queue: the second concurrent job gets 429.
      XI_PROCESSING_WORKERS: "1"
      XI_PROCESSING_QUEUE_SIZE: "0"
      XI_SERVER_SHUTDOWN_DELAY: 2s
      XI_SERVER_SHUTDOWN_TIMEOUT: 20s
    ports:
      - "127.0.0.1::8080"
      - "127.0.0.1::9090"
