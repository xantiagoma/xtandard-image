# Containerised dev environment: the builder stage of the base image (WP-05),
# which carries libvips, Go 1.27.1 (/usr/local/go) and golangci-lint.
#
#   docker compose -f compose.dev.yml run --rm dev task test
#   XI_BASE_IMAGE=xtandard-base:dev docker compose -f compose.dev.yml run --rm dev sh scripts/lint.sh
#
# The Taskfile's docker:* tasks wrap this service.
name: xtandard-image-dev

services:
  dev:
    image: ${XI_BASE_IMAGE:-ghcr.io/xantiagoma/xtandard-image-base:slim}
    working_dir: /src
    volumes:
      - .:/src
      - xi-gocache:/gocache
      - xi-gomodcache:/gomodcache
    environment:
      CGO_ENABLED: "1"
      CGO_CFLAGS_ALLOW: -Xpreprocessor
      GOCACHE: /gocache/go-build
      GOLANGCI_LINT_CACHE: /gocache/golangci-lint
      GOMODCACHE: /gomodcache
      GOTOOLCHAIN: local
      # Worktrees bind-mount a .git file whose target is not in the container.
      GOFLAGS: -buildvcs=false
      FUZZTIME: ${FUZZTIME:-60s}

volumes:
  xi-gocache:
    name: xi-gocache
  xi-gomodcache:
    name: xi-gomodcache
